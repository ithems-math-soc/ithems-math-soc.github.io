# Turns a "news-post" issue (created from the News post form) into a pull
# request that adds the post to the website.
#
# Flow:
#   issue opened/edited  ->  generate _posts/news/<date>-<slug>.md (English),
#                            _posts/ja/news/<date>-<slug>.md (DeepL translation),
#                            images/news/<slug>/* (attached photos, downsized)
#                            _data/publications.yml (Paper posts: added from the DOI)
#                        ->  commit to branch news/issue-<n>, open or update a PR
#                        ->  screenshot the post on the PR (news-preview.yml,
#                            which also runs by itself when someone edits the
#                            post files on the PR) so nobody needs a local build
#                        ->  comment on the issue with the PR link
#
# Only issues by repository collaborators are processed. The workflow can also
# be started by hand (Actions > "News post from issue" > Run workflow) with an
# issue number, which re-processes that issue and refreshes its preview even if
# nothing changed; this is how changes to the workflow are tested from a branch
# before they reach main.
#
# One-time setup (repository admin):
#   1. Settings > Actions > General > Workflow permissions:
#      enable "Allow GitHub Actions to create and approve pull requests".
#   2. Settings > Secrets and variables > Actions: add DEEPL_API_KEY
#      (a DeepL API Free key). Without it, posts are created in English only.
#   3. Make sure the "news-post" label exists.

name: News post from issue

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to (re)process"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: news-post-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  post:
    if: >-
      github.event_name == 'workflow_dispatch'
      || ((contains(github.event.issue.labels.*.name, 'news-post') || startsWith(github.event.issue.title, '[News]'))
          && contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      BRANCH: news/issue-${{ github.event.issue.number || inputs.issue_number }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      changed: ${{ steps.push.outputs.changed }}
      pr_url: ${{ steps.pr.outputs.url }}
      pr_created: ${{ steps.pr.outputs.created }}
      translated: ${{ steps.gen.outputs.translated }}
      warnings: ${{ steps.gen.outputs.warnings }}
      publication: ${{ steps.gen.outputs.publication }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Load the issue
        id: issue
        env:
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/issues/$ISSUE_NUMBER" > /tmp/issue.json
          echo "html_url=$(jq -r .html_url /tmp/issue.json)" >> "$GITHUB_OUTPUT"
          echo "author=$(jq -r .user.login /tmp/issue.json)" >> "$GITHUB_OUTPUT"

      - name: Switch to the branch for this issue
        run: |
          # keep this workflow's scripts: the issue branch may carry older copies
          cp -r .github/scripts /tmp/scripts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            # The issue was edited and a branch already exists: build on it, and
            # bring in anything merged to main since, so the preview shows the
            # post on the current site.
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git merge --no-edit origin/main || { git merge --abort; echo "::warning::could not merge main into $BRANCH; preview may be stale"; }
          else
            git checkout -B "$BRANCH" origin/main
          fi

      - name: Generate the post files
        id: gen
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: ISSUE_JSON="$(cat /tmp/issue.json)" python /tmp/scripts/issue_to_post.py

      - name: Downsize photos for the web
        env:
          SLUG: ${{ steps.gen.outputs.slug }}
        run: |
          if [ -d "images/news/$SLUG" ]; then
            pip install -q pillow
            python /tmp/scripts/downsize_images.py "images/news/$SLUG"
          fi

      - name: Commit and push
        id: push
        env:
          TITLE: ${{ steps.gen.outputs.title }}
        run: |
          # images/news only exists once a post has photos; git add fails on a missing path
          for path in _posts/news _posts/ja/news images/news _data/publications.yml; do
            [ -e "$path" ] && git add -A "$path"
          done
          if git diff --cached --quiet; then
            echo "Nothing changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Add news post: $TITLE"
            git push origin "$BRANCH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the pull request
        id: pr
        if: steps.push.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          TITLE: ${{ steps.gen.outputs.title }}
          EN_URL: ${{ steps.gen.outputs.en_url }}
          JA_URL: ${{ steps.gen.outputs.ja_url }}
          TRANSLATED: ${{ steps.gen.outputs.translated }}
          WARNINGS: ${{ steps.gen.outputs.warnings }}
          PUBLICATION: ${{ steps.gen.outputs.publication }}
          ISSUE_URL: ${{ steps.issue.outputs.html_url }}
          AUTHOR: ${{ steps.issue.outputs.author }}
        run: |
          PR_URL="$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -z "$PR_URL" ]; then
            if [ "$TRANSLATED" = "true" ]; then
              JA_LINE="- Japanese (machine translation): $JA_URL"
            else
              JA_LINE="- Japanese: **not generated** (translation unavailable; see the workflow log)."
            fi
            if [ -n "$WARNINGS" ]; then
              WARN_LINE="**Warnings:** $WARNINGS"
            else
              WARN_LINE=""
            fi
            BODY="$(printf '%s\n' \
              "News post submitted by @$AUTHOR via $ISSUE_URL." \
              "" \
              "**How to review:** screenshots of the post are posted below as a comment. Check the text and the Japanese translation there; to fix something, edit the files under **Files changed** (or edit the original issue to regenerate everything). New screenshots are posted after every change. Then merge." \
              "" \
              "Once merged, the post goes live after a few minutes at these addresses (they do not work before merging):" \
              "- English: $EN_URL" \
              "$JA_LINE" \
              "" \
              "If you correct the Japanese file by hand, set \`machine_translation: false\` in its front matter so it is not overwritten." \
              "" \
              "$PUBLICATION" \
              "" \
              "$WARN_LINE" \
              "" \
              "Closes #$ISSUE_NUMBER")"
            PR_URL="$(gh pr create --base main --head "$BRANCH" --title "News: $TITLE" --body "$BODY")"
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

  # ---- Preview: build the site with the new post and screenshot it -----------

  preview:
    needs: post
    if: needs.post.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/news-preview.yml
    with:
      branch: news/issue-${{ github.event.issue.number || inputs.issue_number }}

  # ---- Report back ------------------------------------------------------------

  report:
    needs: [post, preview]
    if: needs.post.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }} # no checkout in this job, so tell gh which repo
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      PR_URL: ${{ needs.post.outputs.pr_url }}
      CREATED: ${{ needs.post.outputs.pr_created }}
      TRANSLATED: ${{ needs.post.outputs.translated }}
      WARNINGS: ${{ needs.post.outputs.warnings }}
      PUBLICATION: ${{ needs.post.outputs.publication }}
    steps:
      - name: Report back on the issue
        run: |
          if [ "$CREATED" = "true" ]; then
            FIRST="Thanks! A pull request has been opened for this post: $PR_URL"
          else
            FIRST="The pull request has been updated with your edits: $PR_URL"
          fi
          if [ "$TRANSLATED" = "true" ]; then
            JA_LINE="A Japanese version was generated by machine translation; please glance over it in the pull request."
          else
            JA_LINE="The Japanese version could not be generated this time (translation service unavailable). An admin can check the workflow log."
          fi
          if [ -n "$WARNINGS" ]; then
            WARN_LINE="Note: $WARNINGS"
          else
            WARN_LINE=""
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$(printf '%s\n' \
            "$FIRST" \
            "" \
            "Screenshots of the finished post are in the pull request. Once a team member merges it, the post goes live." \
            "$JA_LINE" \
            "$PUBLICATION" \
            "" \
            "Need to change something? Edit this issue (title, fields, or body) and the pull request will be updated automatically." \
            "" \
            "$WARN_LINE")"

  report-failure:
    needs: [post, preview]
    if: failure()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Report a failure on the issue
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "$(printf '%s\n' \
            "Sorry, the post could not be generated automatically." \
            "" \
            "Common causes: the Type field is empty or not one of the listed types, or the Date is not in YYYY-MM-DD format. Please check the fields, edit the issue, and the workflow will run again." \
            "" \
            "Details for admins: $RUN_URL")" || true
