<!DOCTYPE html>
<html lang="{{ page.lang | default: site.locale | default: 'en' }}">
  <head>
    {% include head.html %}
  </head>

  <body>
    {% include header.html %}

    {% if page.image.feature %}
    <div class="page-lead" style="background-image:url({{ site.url }}/images/{{ page.image.feature }})" role="img" aria-label="{{ site.title }}">
      <div class="wrap page-lead-content"></div>
    </div>
    {% endif %}

    <div id="page-wrapper" tabindex="-1">
      <div id="main" role="main">
        <div class="wrap">
          <div class="page-content">
            {{ content }}
          </div>
        </div>
      </div>
      {% include footer.html %}
    </div>

    {% include scripts.html %}
  </body>
</html>
